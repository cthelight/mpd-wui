<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>__MPD_WUI_TITLE__</title>
    <meta name="app-title" content="__MPD_WUI_TITLE__" />
    <link rel="icon" type="image/svg+xml" href="/img/icon.svg" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <span class="wordmark"><img class="wordmark-icon" src="/img/icon.svg" alt="" width="20" height="20" /><span class="wordmark-text">__MPD_WUI_TITLE__</span></span>
      <span id="conn" class="conn"></span>
      <nav class="tabs" role="tablist" aria-label="Views">
        <button class="tab" data-view="nowplaying" role="tab" aria-selected="true">Now Playing</button>
        <button class="tab" data-view="queue" role="tab" aria-selected="false">Queue</button>
        <button class="tab" data-view="library" role="tab" aria-selected="false">Library</button>
      </nav>
    </header>
    <div id="conn-banner" class="conn-banner" hidden>
      <span data-banner-msg></span>
      <button class="retry" data-banner-retry type="button">Retry</button>
    </div>
    <main id="view" class="view"></main>
    <footer class="minibar" id="minibar"></footer>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
