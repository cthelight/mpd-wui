<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mpd-wui</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e6a23c' d='M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <span class="wordmark">mpd-wui</span>
      <span id="conn" class="conn"></span>
      <nav class="tabs" role="tablist" aria-label="Views">
        <button class="tab" data-view="nowplaying" role="tab" aria-selected="true">Now Playing</button>
        <button class="tab" data-view="queue" role="tab" aria-selected="false">Queue</button>
        <button class="tab" data-view="library" role="tab" aria-selected="false">Library</button>
      </nav>
    </header>
    <div id="conn-banner" class="conn-banner" hidden>
      <span data-banner-msg></span>
      <button class="retry" data-banner-retry type="button">Retry</button>
    </div>
    <main id="view" class="view"></main>
    <footer class="minibar" id="minibar"></footer>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
