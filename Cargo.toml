[workspace]
resolver = "2"
members = [
    "crates/mpd-wui",
    "crates/mpd-client",
    "crates/mpd-api",
    "crates/mpd-web",
    "crates/mpd-mock",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures-util = "0.3"
rust-embed = "8"
http-body-util = "0.1"
nucleo-matcher = "0.3"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
